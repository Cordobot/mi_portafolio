<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="CorTV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#3F0D12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- side rail -->
  <rect x="0" y="0" width="64" height="360" fill="#fff" opacity=".05"/>
  <g fill="#fff" opacity=".6">
    <circle cx="32" cy="110" r="8"/><circle cx="32" cy="150" r="8" fill="#F43F5E" opacity="1"/>
    <circle cx="32" cy="190" r="8"/><circle cx="32" cy="230" r="8"/><circle cx="32" cy="270" r="8"/>
  </g>
  <!-- hero -->
  <rect x="92" y="72" width="300" height="168" rx="16" fill="url(#card)" stroke="#fff" stroke-width="4"/>
  <circle cx="242" cy="156" r="34" fill="#fff" opacity=".95"/>
  <path d="M232 138l28 18-28 18z" fill="#9F1239"/>
  <rect x="108" y="88" width="56" height="22" rx="6" fill="#fff"/>
  <text x="136" y="104" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E11D48">● EN VIVO</text>
  <!-- posters -->
  <g>
    <rect x="414" y="72" width="62" height="92" rx="8" fill="#fff" opacity=".18"/>
    <rect x="486" y="72" width="62" height="92" rx="8" fill="#fff" opacity=".12"/>
    <rect x="558" y="72" width="62" height="92" rx="8" fill="#fff" opacity=".08"/>
    <rect x="414" y="176" width="62" height="64" rx="8" fill="#fff" opacity=".12"/>
    <rect x="486" y="176" width="62" height="64" rx="8" fill="#fff" opacity=".08"/>
    <rect x="558" y="176" width="62" height="64" rx="8" fill="#fff" opacity=".05"/>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fff" opacity=".75">
    <text x="92" y="284">TV en vivo · Películas · Series · Animes · Kids</text>
  </g>
  <rect x="92" y="300" width="300" height="6" rx="3" fill="#fff" opacity=".15"/>
  <rect x="92" y="300" width="190" height="6" rx="3" fill="#F43F5E"/>
  <text x="92" y="48" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">CorTV</text>
