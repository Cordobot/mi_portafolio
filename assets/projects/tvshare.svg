<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Tvshare">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- TV -->
  <rect x="60" y="100" width="200" height="124" rx="10" fill="#0F172A" stroke="#fff" stroke-opacity=".8" stroke-width="4"/>
  <rect x="72" y="112" width="176" height="100" rx="4" fill="url(#screen)"/>
  <path d="M146 140l34 22-34 22z" fill="#fff"/>
  <path d="M130 240h60M160 224v16" stroke="#fff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
  <!-- waves -->
  <g fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round">
    <path d="M290 140q20 22 0 44" opacity=".5"/>
    <path d="M310 126q32 36 0 72" opacity=".75"/>
    <path d="M330 112q44 50 0 100"/>
  </g>
  <!-- Laptop -->
  <rect x="396" y="100" width="190" height="122" rx="8" fill="#0F172A" stroke="#fff" stroke-opacity=".8" stroke-width="4"/>
  <rect x="408" y="112" width="166" height="98" rx="3" fill="url(#screen)"/>
  <path d="M478 140l34 22-34 22z" fill="#fff"/>
  <path d="M376 230h230l-14 16H390z" fill="#fff" fill-opacity=".8"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#fff" opacity=".7" text-anchor="middle">
    <text x="160" y="280">Android TV</text>
    <text x="490" y="280">PC · Compose Desktop</text>
    <text x="325" y="250">H.264 · TCP/UDP</text>
  </g>
  <text x="32" y="48" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">Tvshare</text>
</svg>
